name: links

# Markdown-link lint per docs/AGENTS.md:
#   npx --yes markdown-link-check docs/**/*.md
#   ([VERIFY] 2026-09-20 — https://github.com/tcort/markdown-link-check)

on:
  push:
    branches: ["main"]
    paths:
      - "**.md"
  pull_request:
    branches: ["main"]
    paths:
      - "**.md"
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check markdown links (docs/**/*.md)
        run: |
          shopt -s globstar nullglob
          files=(docs/**/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No markdown files found"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            npx --yes markdown-link-check "$f" || exit 1
          done
