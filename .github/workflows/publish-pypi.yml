name: Publish PyPI

# PyPI auto-publish for algorithco-guard-eval (ADR-0013/0014).
# Dry-run (build + twine check) on PR/push to main, no secrets.
# Real upload only on tag `release/*` or dispatch confirm=publish, env `release`.
# Preferred auth: Trusted Publisher (OIDC, no secret). Fallback: PYPI_API_TOKEN.

on:
  push:
    branches: ["main"]
    tags: ["release/*"]
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'publish' for a REAL upload (default is dry-run)"
        required: false
        default: "dry-run"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/release/') }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build eval package
        working-directory: eval
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check
        working-directory: eval
        run: python -m twine check dist/*

      - name: Assert wheel scope (no tests/jev_client, has entry point)
        working-directory: eval
        run: |
          python - <<'EOF'
          import sys, zipfile
          from pathlib import Path
          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          names = zipfile.ZipFile(wheels[-1]).namelist()
          assert not any(n.startswith("tests") for n in names), f"tests leaked into wheel: {names}"
          assert not any("jev_client" in n for n in names), f"jev_client leaked into wheel: {names}"
          ep = zipfile.ZipFile(wheels[-1]).read([n for n in names if n.endswith("entry_points.txt")][0]).decode()
          assert "eval-harness" in ep, f"missing console script: {ep}"
          print("wheel scope OK")
          EOF

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist-py${{ matrix.python-version }}-${{ github.sha }}
          path: eval/dist/

  publish:
    if: startsWith(github.ref, 'refs/tags/release/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')
    needs: [dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC Trusted Publisher + attestations
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        working-directory: eval
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI (OIDC preferred, token fallback)
        # pypa/gh-action-pypi-publish uses Trusted Publishing when no password
        # is given ([VERIFY] re-check at release: https://github.com/pypa/gh-action-pypi-publish).
        # `release/v1` is the upstream-recommended stable tag.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: eval/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: eval/dist/*
