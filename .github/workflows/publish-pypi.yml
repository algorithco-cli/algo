name: Build Python package

# Build and validate algorithco-guard-eval without publishing it.
# Real package publication is intentionally limited to crates.io and npm.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build eval package
        working-directory: eval
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: twine check
        working-directory: eval
        run: python -m twine check dist/*

      - name: Assert wheel scope (no tests/jev_client, has entry point)
        working-directory: eval
        run: |
          python - <<'EOF'
          import sys, zipfile
          from pathlib import Path
          wheels = sorted(Path("dist").glob("*.whl"))
          assert wheels, "no wheel built"
          names = zipfile.ZipFile(wheels[-1]).namelist()
          assert not any(n.startswith("tests") for n in names), f"tests leaked into wheel: {names}"
          assert not any("jev_client" in n for n in names), f"jev_client leaked into wheel: {names}"
          ep = zipfile.ZipFile(wheels[-1]).read([n for n in names if n.endswith("entry_points.txt")][0]).decode()
          assert "eval-harness" in ep, f"missing console script: {ep}"
          print("wheel scope OK")
          EOF

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist-py${{ matrix.python-version }}-${{ github.sha }}
          path: eval/dist/
