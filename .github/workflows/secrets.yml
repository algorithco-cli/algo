name: secrets

# Secret scanning per repo rule (pre-commit + CI).
# Previous `gitleaks/gitleaks-action@v2` now requires a GITLEAKS_LICENSE for
# org repos ("[algorithcoguard] is an organization. License key is required." —
# 4d585cb failure, 2026-09-20, no secret flagged). Switched to the OSS binary
# via `zricethezav/gitleaks` docker to keep the same rules without a license
# gate. If a real credential is ever flagged, it is redacted in logs.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks scan (OSS, no org license)
        # Pinned (not :latest) for supply-chain determinism — gitleaks v8.30.1
        # verified 2026-09-23 (https://github.com/gitleaks/gitleaks/releases).
        # --config EXTENDS the default rules ([extend] useDefault in
        # .gitleaks.toml); without it the file would REPLACE them and the gate
        # would pass everything. Baseline allowlists 13 verified-synthetic
        # fixtures (fingerprints + justification in the file); new leaks fail.
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:v8.30.1 detect --config /path/.gitleaks.toml --source /path --verbose --redact --exit-code 2
