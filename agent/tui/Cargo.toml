[package]
name = "algo-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "TUI for algorithco guard — live decision feed, stats, policy editor (offline-capable, read-only audit.db)"
readme = "README.md"

[[bin]]
name = "algo-tui"
path = "src/main.rs"

[dependencies]
algo-audit = { path = "../crates/audit" }
algo-types = { path = "../../core/crates/types" }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.53", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
algo-types = { path = "../../core/crates/types" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
