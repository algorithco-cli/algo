[package]
name = "algocli-cli"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI for algorithco guard (bare algo launches TUI; algo init|uninstall|doctor|pause|resume|status|why|log|tui)"
keywords = ["cli", "command-line", "security"]
categories = ["command-line-utilities"]

[[bin]]
name = "algo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
chrono = "0.4"
algo-audit = { version = "0.1.0", path = "../audit", package = "algocli-audit" }
algo-types = { version = "0.1.0", path = "../../../core/crates/types", package = "algocli-types" }
algo-redact = { version = "0.1.0", path = "../../../core/crates/redact", package = "algocli-redact" }
algo-fingerprint = { version = "0.1.0", path = "../../../core/crates/fingerprint", package = "algocli-fingerprint" }
algo-provider = { version = "0.1.0", path = "../../../core/crates/provider", package = "algocli-provider" }
algo-policy = { version = "0.1.0", path = "../../../core/crates/policy", package = "algocli-policy" }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
