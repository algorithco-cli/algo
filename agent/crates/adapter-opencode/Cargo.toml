[package]
name = "algo-adapter-opencode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenCode adapter (P4 spike): plugin system, degrade gracefully"
keywords = ["ai", "adapter", "opencode"]
categories = ["development-tools"]

[dependencies]
algo-types = { version = "0.1.0", path = "../../../core/crates/types" }
algo-redact = { version = "0.1.0", path = "../../../core/crates/redact" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
proptest = "1"
