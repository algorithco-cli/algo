[package]
name = "algo-adapter-claude"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Claude adapter shell-only (P1-07) – parse PreToolUse Bash → CanonicalEvent, render Decision → hook JSON. [VERIFY] payload shapes vs Claude docs – refresh each release."
readme = "README.md"
keywords = ["ai", "adapter", "claude"]
categories = ["development-tools"]

[dependencies]
algo-types = { version = "0.1.0", path = "../../../core/crates/types" }
algo-redact = { version = "0.1.0", path = "../../../core/crates/redact" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
