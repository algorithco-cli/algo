[package]
name = "algo-scanner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scanner (P4): tree-sitter pre-filter + Jev judge, report-only"

[dependencies]
algo-types = { path = "../../../core/crates/types" }
algo-provider = { path = "../../../core/crates/provider" }
algo-redact = { path = "../../../core/crates/redact" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
