[package]
name = "algocli-account-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Algorithco account OAuth and native credential storage for Guard clients"

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "9.3.1", default-features = false }
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
ring = "0.17"
tempfile = "3.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
