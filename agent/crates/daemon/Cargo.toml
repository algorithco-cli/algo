[package]
name = "algo-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Daemon for algorithco guard (algo.sock, pipeline L0-L4, single SQLite writer)"

[[bin]]
name = "algo-daemon"
path = "src/main.rs"

[dependencies]
algo-types = { path = "../../../core/crates/types" }
algo-policy = { path = "../../../core/crates/policy" }
algo-fingerprint = { path = "../../../core/crates/fingerprint" }
algo-redact = { path = "../../../core/crates/redact" }
algo-provider = { path = "../../../core/crates/provider" }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tempfile = "3.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
