[package]
name = "algo-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Daemon for algorithco guard (algo.sock, pipeline L0-L4, single SQLite writer)"

[[bin]]
name = "algo-daemon"
path = "src/main.rs"

[dependencies]
algo-types = { path = "../../../core/crates/types" }
algo-policy = { path = "../../../core/crates/policy" }
algo-fingerprint = { path = "../../../core/crates/fingerprint" }
algo-redact = { path = "../../../core/crates/redact" }
algo-provider = { path = "../../../core/crates/provider" }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
chrono = "0.4"

[[bench]]
name = "pipeline_L0L1"
harness = false
# hints: `pipeline_L0L1` group benches Pipeline::decide L0 deny + L1 cache hit (100 rps, <3ms p50); see benches/pipeline_L0L1.rs

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tempfile = "3.10"
criterion = { version = "0.8", features = ["html_reports"] }

[features]
# Real Jev client in the pool (default OFF — Mock only, Jev stays OFF per waiver).
jev = ["algo-provider/jev"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
