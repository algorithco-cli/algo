[package]
name = "algo-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Policy engine: hard-deny + profiles, compile-once at load (P1-CORE-3/4)"
readme = "README.md"

[dependencies]
algo-types = { path = "../types" }
algo-shell-analysis = { path = "../shell-analysis" }
regex = "1.12"

[[bench]]
name = "policy_eval"
harness = false
# hints: criterion html_reports + zero-alloc hot path (SmallVec/Arc), no regex in L0; see benches/policy_eval.rs header for budget

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
