[package]
name = "algo-fingerprint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Fingerprint normalization for cache (proptest idempotence, blake3 cache_key)"
readme = "README.md"
keywords = ["caching", "hashing", "fingerprint"]
categories = ["development-tools"]

[dependencies]
algo-types = { version = "0.1.0", path = "../types" }
blake3 = "1.5"
regex = "1.12"

[[bench]]
name = "normalize"
harness = false
# hints: `fingerprint_normalize` group benches normalize + cache_key (10KB long command); see benches/normalize.rs

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
