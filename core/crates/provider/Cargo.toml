[package]
name = "algo-provider"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "DecisionProvider trait + mock + feature-gated Jev client (Jev OFF by default)"
readme = "README.md"

[dependencies]
algo-types = { path = "../types" }
thiserror = "2.0"
# HTTP only for the feature-gated Jev client; default build stays mock-only (no network).
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "http2", "rustls-tls"] }
serde_json = { version = "1.0", optional = true }

[features]
# Real Jev client (BYOK, shadow-only use). OFF by default per ADR-0009; the daemon
# keeps MockProvider until the redact + consent + shadow gates clear.
jev = ["dep:reqwest", "dep:serde_json"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
