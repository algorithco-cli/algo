[package]
name = "algo-redact"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Redact secrets and PII before egress (core, first Phase 1 task per ADR-0009 waiver)"
readme = "README.md"

[dependencies]
regex = "1.12"
aho-corasick = "1.1"
smallvec = { version = "1.13", features = ["const_generics"] }

[dev-dependencies]
proptest = "1.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
