[project]
name = "algorithco-guard-eval"
version = "0.1.0"
description = "Phase-0 eval dataset + harness skeleton for algorithco guard (CLI algo). No product code."
readme = "AGENTS.md"
requires-python = ">=3.10"
license = "LicenseRef-TBD-legal-signoff"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["harness*", "baselines*", "tests*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
packages = ["harness", "baselines", "tests"]
