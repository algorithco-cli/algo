# deny.toml — cargo-deny config per P1-09 (fmt/lint/type + deny/audit/vet clean, fail on warn)
# Gate: `cargo deny check` must be clean; see plans/phase-1-09-quality-latency-eval.md:5
# This config is intentionally permissive on first private MVP and tightened before public release.
# Ratify via ADR before adding bans.

[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
# Separate dir from cargo-audit's default (~/.cargo/advisory-db): both tools
# refuse to clone into a non-empty dir owned by the other (CI failure
# 2026-09-23, PR #1).
db-path = "~/.cargo/advisory-db-deny"
# NOTE: this was wrong (crates.io index) until 2026-09-23 — the advisory DB
# is rustsec/advisory-db. Never exercised before rust.yml ran it in CI.
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny ≥0.18: vulnerability/notice/unmaintained/unsound are deny by
# default; `yanked` keeps warn. `unmaintained` is a scope enum
# (all/workspace/transitive/none) — "workspace" errors only for direct deps
# (hits go to `ignore` with reason).
yanked = "warn"
unmaintained = "workspace"
ignore = [
  # RUSTSEC-2023-0071 (rsa Marvin timing sidechannel, no patch available):
  # rsa is a DEV-ONLY dep of backend (ephemeral test keygen + mock ID-token
  # signing). Never in the shipped binary, never decrypts attacker input —
  # the advisory's own workaround (local-only use) applies. Revisit if rsa
  # ever becomes a runtime dependency.
  { id = "RUSTSEC-2023-0071", reason = "dev-only test keygen/signing in backend (never shipped, no decryption oracle); advisory workaround applies" },
]

[licenses]
# cargo-deny ≥0.18: deny-by-default — every license must be in `allow`
# (old unlicensed/deny/copyleft/allow-osi-fsf-free keys were removed).
# Workspace crates use LicenseRef-TBD-legal-signoff until ADR-0001 legal
# sign-off (see DEFERRED.md:5.2) — allowed explicitly below.
# SPDX allowlist for dependencies (covers regex, aho-corasick, smallvec, tree-sitter, prost, criterion, serde, etc.)
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDDL-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "Zlib",
  "LicenseRef-TBD-legal-signoff",
]
# Use `cargo deny list` to see actual license strings if this needs tightening
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow-wildcard-paths = false
# cargo-deny ≥0.20: `allow-build-scripts` moved to [bans.build] as a
# package-spec array; omitted here = all build scripts allowed (same intent
# as the old `= true`). Tighten via ADR when needed.
# No banned crates yet; add via ADR when needed (e.g., copyleft at public release)
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
