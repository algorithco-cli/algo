version: v2
# Codegen inputs: canonical v0 contracts only.
# Generated code is build output — never hand-edit (see VERSIONING.md).
inputs:
  - directory: .
plugins:
  # Rust codegen via prost.
  - local: protoc-gen-prost
    out: gen/rust
    opt:
      - compile_well_known_types=true
  # TypeScript codegen via protobuf-es. `import_extension=js` is required so
  # the emitted imports resolve under Node.js ESM (extensionless imports
  # fail with ERR_MODULE_NOT_FOUND at runtime).
  - local: protoc-gen-es
    out: gen/ts
    opt:
      - target=ts
      - import_extension=js
