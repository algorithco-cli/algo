// Backend cloud API v0 for algorithco guard (CLI `algo`).
//
// P3-01: Auth (device tokens), Org/Team/Role, PolicyBundle{version,signed_bytes,sig},
// PolicyDryRun, AuditIngest{redacted_event,decision,latency} (no source field), StatsQuery.
// ConnectRPC service defs. Tag; Rust+TS clients compile.
//
// Privacy: AuditIngest carries REDACTED payloads only. No source field.
// Fail-safe: every I/O/timeout/parse proves ask downstream.
syntax = "proto3";

package algorithco_guard.v0;

// --- Auth: device flow ---

message AuthDeviceRequest {
  string client_id = 1;
  string scope = 2;
}

message AuthDeviceResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  int32 expires_in = 4;
  int32 interval = 5;
}

message AuthDevicePollRequest {
  string device_code = 1;
}

message AuthDevicePollResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
  bool pending = 4;
}

// --- Org / Team / Role ---

message Org {
  string org_id = 1;
  string name = 2;
  string owner_id = 3;
  string created_at = 4;
}

message Team {
  string team_id = 1;
  string org_id = 2;
  string name = 3;
}

enum RoleType {
  ROLE_TYPE_UNSPECIFIED = 0;
  ROLE_TYPE_ADMIN = 1;
  ROLE_TYPE_MEMBER = 2;
  ROLE_TYPE_VIEWER = 3;
}

message RoleAssignment {
  string user_id = 1;
  string org_id = 2;
  RoleType role = 3;
}

message CreateOrgRequest {
  string org_name = 1;
  string owner_id = 2;
}

message CreateOrgResponse {
  Org org = 1;
}

message GetOrgRequest {
  string org_id = 1;
}

message GetOrgResponse {
  Org org = 1;
}

// --- PolicyBundle: versioned, detached signature, rollback protection ---

message PolicyBundle {
  string version = 1;
  bytes signed_bytes = 2;
  bytes sig = 3;
}

message GetPolicyRequest {
  string version = 1;
  string org_id = 2;
}

message GetPolicyResponse {
  PolicyBundle bundle = 1;
  bool not_modified = 2;
}

message PublishPolicyRequest {
  PolicyBundle bundle = 1;
  string org_id = 2;
}

message PublishPolicyResponse {
  string version = 1;
  bool ok = 2;
}

// --- PolicyDryRun: replay bundle vs redacted history ---

message DryRunRequest {
  PolicyBundle bundle = 1;
  repeated string history_ids = 2;
  string org_id = 3;
}

message DryRunResponse {
  string result = 1;
  repeated string decisions = 2;
  int64 evaluated = 3;
}

// --- AuditIngest: redacted_event, decision, latency (no source field) ---
// Buf lint requires RPC+Request naming, so canonical name is IngestAudit*.

message IngestAuditRequest {
  string redacted_event = 1;
  string decision = 2;
  int64 latency_ms = 3;
  string trace_id = 4;
  string org_id = 5;
}

message IngestAuditResponse {
  bool ok = 1;
  string trace_id = 2;
}

// --- StatsQuery: aggregates over redacted audit ---
// Buf lint requires RPC+Request naming, so canonical name is QueryStats*.

message QueryStatsRequest {
  string org_id = 1;
  string from = 2;
  string to = 3;
}

message QueryStatsResponse {
  int64 total = 1;
  int64 allow = 2;
  int64 deny = 3;
  int64 ask = 4;
  double avg_latency_ms = 5;
}

// --- GuardService: ConnectRPC service defs ---

service GuardService {
  // Device flow: init and poll for token.
  rpc AuthDevice(AuthDeviceRequest) returns (AuthDeviceResponse);
  rpc AuthDevicePoll(AuthDevicePollRequest) returns (AuthDevicePollResponse);
  // Org CRUD.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // Policy sync: publish signed bundle, fetch by version, dry-run.
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc PublishPolicy(PublishPolicyRequest) returns (PublishPolicyResponse);
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
  // Audit ingest (redacted only, no source).
  rpc IngestAudit(IngestAuditRequest) returns (IngestAuditResponse);
  // Stats aggregates.
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
}
