// Backend cloud API v0 for algorithco guard (CLI `algo`).
//
// P3-01: Auth (device tokens), Org/Team/Role, PolicyBundle{version,signed_bytes,sig},
// PolicyDryRun, AuditIngest{redacted_event,decision,latency} (no source field), StatsQuery.
// ConnectRPC service defs. Tag; Rust+TS clients compile.
//
// Privacy: AuditIngest carries REDACTED payloads only. No source field.
// Fail-safe: every I/O/timeout/parse proves ask downstream.
syntax = "proto3";

package algorithco_guard.v0;

// --- Auth: device flow ---

message AuthDeviceRequest {
  string client_id = 1;
  string scope = 2;
}

message AuthDeviceResponse {
  string device_code = 1;
  string user_code = 2;
  string verification_uri = 3;
  int32 expires_in = 4;
  int32 interval = 5;
}

message AuthDevicePollRequest {
  string device_code = 1;
}

message AuthDevicePollResponse {
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;
  bool pending = 4;
}

// --- Org / Team / Role ---

message Org {
  string org_id = 1;
  string name = 2;
  string owner_id = 3;
  string created_at = 4;
}

message Team {
  string team_id = 1;
  string org_id = 2;
  string name = 3;
}

enum RoleType {
  ROLE_TYPE_UNSPECIFIED = 0;
  ROLE_TYPE_ADMIN = 1;
  ROLE_TYPE_MEMBER = 2;
  ROLE_TYPE_VIEWER = 3;
}

message RoleAssignment {
  string user_id = 1;
  string org_id = 2;
  RoleType role = 3;
}

message CreateOrgRequest {
  string org_name = 1;
  string owner_id = 2;
}

message CreateOrgResponse {
  Org org = 1;
}

message GetOrgRequest {
  string org_id = 1;
}

message GetOrgResponse {
  Org org = 1;
}

// --- PolicyBundle: versioned, detached signature, rollback protection ---

message PolicyBundle {
  string version = 1;
  bytes signed_bytes = 2;
  bytes sig = 3;
}

message GetPolicyRequest {
  string version = 1;
  string org_id = 2;
}

message GetPolicyResponse {
  PolicyBundle bundle = 1;
  bool not_modified = 2;
}

message PublishPolicyRequest {
  PolicyBundle bundle = 1;
  string org_id = 2;
}

message PublishPolicyResponse {
  string version = 1;
  bool ok = 2;
}

// --- PolicyDryRun: replay bundle vs redacted history ---

message DryRunRequest {
  PolicyBundle bundle = 1;
  repeated string history_ids = 2;
  string org_id = 3;
}

message DryRunResponse {
  string result = 1;
  repeated string decisions = 2;
  int64 evaluated = 3;
}

// --- AuditIngest: redacted_event, decision, latency (no source field) ---
// Buf lint requires RPC+Request naming, so canonical name is IngestAudit*.

message IngestAuditRequest {
  string redacted_event = 1;
  string decision = 2;
  int64 latency_ms = 3;
  string trace_id = 4;
  string org_id = 5;
}

message IngestAuditResponse {
  bool ok = 1;
  string trace_id = 2;
}

// --- StatsQuery: aggregates over redacted audit ---
// Buf lint requires RPC+Request naming, so canonical name is QueryStats*.

message QueryStatsRequest {
  string org_id = 1;
  string from = 2;
  string to = 3;
}

message QueryStatsResponse {
  int64 total = 1;
  int64 allow = 2;
  int64 deny = 3;
  int64 ask = 4;
  double avg_latency_ms = 5;
}

// --- Plans & subscriptions (self-managed; no MoR/payment secrets) ---
//
// Tiers pro/max/team mirror the web Pricing page (per seat). Enforcement
// reads GetEntitlement; plans are bundles of entitlements, never bare
// `plan_id ==` checks. Billing provider integration (ADR-0006 MoR) is
// deferred: `provider` is "manual" until a vendor lands, and
// BillingWebhook is reserved (unimplemented) so no fake processing exists.

enum PlanTier {
  PLAN_TIER_UNSPECIFIED = 0;
  PLAN_TIER_FREE = 1;
  PLAN_TIER_PRO = 2;
  PLAN_TIER_MAX = 3;
  PLAN_TIER_TEAM = 4;
}

message FeatureSet {
  bool signed_bundles = 1;
  bool dry_run = 2;
  bool dashboard = 3;
  bool per_user_stats = 4;
  bool oauth_org = 5;
  bool siem_export = 6;
  bool sso_scim = 7;
}

message Plan {
  PlanTier tier = 1;
  string name = 2;
  // Per-seat per-month, minor units (cents).
  int64 monthly_cents = 3;
  int64 annual_cents = 4;
  int32 seats_included = 5;
  // Hard seat cap; -1 = unlimited.
  int64 max_seats = 6;
  int32 rate_multiplier = 7;
  int32 retention_days = 8;
  FeatureSet features = 9;
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_TRIALING = 1;
  SUBSCRIPTION_STATUS_ACTIVE = 2;
  SUBSCRIPTION_STATUS_PAST_DUE = 3;
  SUBSCRIPTION_STATUS_CANCELED = 4;
  SUBSCRIPTION_STATUS_UNPAID = 5;
  SUBSCRIPTION_STATUS_EXPIRED = 6;
  SUBSCRIPTION_STATUS_INCOMPLETE = 7;
}

message Subscription {
  string id = 1;
  string org_id = 2;
  // Owner identity (auth subject) bound at creation. Only the owner may
  // read, mutate, or spend this subscription — org_id alone never confers
  // access. Never exposed outside the backend.
  string owner_id = 16;
  PlanTier tier = 3;
  SubscriptionStatus status = 4;
  int32 seats = 5;
  // "monthly" | "annual".
  string cycle = 6;
  // Total per-period price, minor units (cents).
  int64 price_cents = 7;
  // Unix seconds.
  int64 period_start = 8;
  int64 period_end = 9;
  // Unix seconds; 0 = no trial.
  int64 trial_end = 10;
  bool cancel_at_period_end = 11;
  // Pending downgrade applied at period end; UNSPECIFIED = none.
  PlanTier scheduled_tier = 12;
  // Billing provider: "manual" until ADR-0006 MoR vendor lands.
  string provider = 13;
  string provider_subscription_id = 14;
  // Reserved per ADR-0006: inert tier snapshot label. Enforcement MUST read
  // GetEntitlement; unknown values prove ask downstream, never allow.
  optional string entitlement = 15;
}

message Entitlement {
  PlanTier tier = 1;
  SubscriptionStatus status = 2;
  // Paid features currently usable (status + grace resolved server-side).
  bool valid = 3;
  FeatureSet features = 4;
  int64 max_seats = 5;
  int32 rate_multiplier = 6;
  int32 retention_days = 7;
  // Seconds of past-due grace left; 0 when not past due.
  int64 grace_seconds_left = 8;
  // Short human-readable upsell hint; empty when entitled.
  string upgrade_hint = 9;
  Subscription subscription = 10;
}

message GetPlansRequest {}

message GetPlansResponse {
  repeated Plan plans = 1;
}

message GetSubscriptionRequest {
  string org_id = 1;
}

message GetSubscriptionResponse {
  // Set when the org has a subscription; otherwise tier=free/status=none.
  Subscription subscription = 1;
  PlanTier tier = 2;
  string status = 3;
}

message CreateSubscriptionRequest {
  string org_id = 1;
  PlanTier tier = 2;
  // "monthly" | "annual".
  string cycle = 3;
  int32 seats = 4;
}

message CreateSubscriptionResponse {
  Subscription subscription = 1;
}

message ChangeSubscriptionRequest {
  string id = 1;
  // Optional fields: UNSPECIFIED / empty = unchanged.
  PlanTier tier = 2;
  int32 seats = 3;
  string cycle = 4;
}

message ChangeSubscriptionResponse {
  Subscription subscription = 1;
  // True when the tier change was scheduled for period end (downgrade).
  bool scheduled = 2;
}

message CancelSubscriptionRequest {
  string id = 1;
  bool at_period_end = 2;
}

message CancelSubscriptionResponse {
  Subscription subscription = 1;
}

message UpdateSeatsRequest {
  string id = 1;
  int32 seats = 2;
}

message UpdateSeatsResponse {
  Subscription subscription = 1;
}

message GetEntitlementRequest {
  string org_id = 1;
}

message GetEntitlementResponse {
  Entitlement entitlement = 1;
}

// --- GuardService: ConnectRPC service defs ---

service GuardService {
  // Device flow: init and poll for token.
  rpc AuthDevice(AuthDeviceRequest) returns (AuthDeviceResponse);
  rpc AuthDevicePoll(AuthDevicePollRequest) returns (AuthDevicePollResponse);
  // Org CRUD.
  rpc CreateOrg(CreateOrgRequest) returns (CreateOrgResponse);
  rpc GetOrg(GetOrgRequest) returns (GetOrgResponse);
  // Policy sync: publish signed bundle, fetch by version, dry-run.
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc PublishPolicy(PublishPolicyRequest) returns (PublishPolicyResponse);
  rpc DryRun(DryRunRequest) returns (DryRunResponse);
  // Audit ingest (redacted only, no source).
  rpc IngestAudit(IngestAuditRequest) returns (IngestAuditResponse);
  // Stats aggregates.
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse);
  // Plans & subscriptions (self-managed billing; MoR webhook reserved).
  rpc GetPlans(GetPlansRequest) returns (GetPlansResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  rpc CreateSubscription(CreateSubscriptionRequest) returns (CreateSubscriptionResponse);
  rpc ChangeSubscription(ChangeSubscriptionRequest) returns (ChangeSubscriptionResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc UpdateSeats(UpdateSeatsRequest) returns (UpdateSeatsResponse);
  rpc GetEntitlement(GetEntitlementRequest) returns (GetEntitlementResponse);
}
