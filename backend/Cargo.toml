[package]
name = "algo-backend"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-TBD-legal-signoff"
repository = "https://github.com/algorithcoguard/algorithco-guard"
rust-version = "1.75"
description = "algorithco guard backend: Auth(device flow), Org/Team/Role, Policy sync, Audit ingest, Stats (P3-01..P3-05 MVP, in-memory scaffold)"
readme = "README.md"

[[bin]]
name = "algo-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
ed25519-dalek = { version = "3", features = ["rand_core"] }
jsonwebtoken = "9"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
base64 = "0.22"
http-body-util = "0.1"

# Optional Postgres scaffolding (MVP uses in-memory HashMap, compile-checked when enabled)
# sqlx = { version = "0.8", features = ["postgres", "rustls", "chrono", "uuid"], optional = true }

[dev-dependencies]
# no extra dev deps; tests use tower::ServiceExt via main deps

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
